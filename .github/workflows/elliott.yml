name: Run Python daily at 21:30 Europe/Warsaw

on:
  schedule:
    - cron: "11 18 * 4-10 1-5"
    - cron: "11 19 * 11-12 1-5"
    - cron: "11 19 * 1-3 1-5"

  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        if: hashFiles('requirements.txt') != ''
      - name: Run script
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SEND_EMAIL: ${{ secrets.SEND_EMAIL }}
          RUN_FOR_ALL_COMPANIES: ${{ secrets.RUN_FOR_ALL_COMPANIES }}
        run: python elliott.py
