name: Run Python daily at 21:30 Europe/Warsaw

on:
  schedule:
    - cron: "11 19 * 4-10 *"
    - cron: "11 20 * 11-12 *"
    - cron: "11 20 * 1-3 *"

  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        if: hashFiles('requirements.txt') != ''
      - name: Run script
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python elliott.py
